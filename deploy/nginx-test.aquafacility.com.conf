# /etc/nginx/sites-available/test.aquafacility.com
# The site now lives on aquafacility.com. This subdomain only redirects, so
# there is one public copy and search engines see one address.
server {
    listen 80;
    listen [::]:80;
    server_name test.aquafacility.com;
    return 301 https://aquafacility.com$request_uri;
}
