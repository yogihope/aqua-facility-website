# /etc/nginx/sites-available/aquafacility.com
# Main site. certbot --nginx adds the 443 block and the http->https redirect.
# www is listed so the certificate and redirect cover it the moment the www
# DNS record moves to this server.
server {
    listen 80;
    listen [::]:80;
    server_name aquafacility.com www.aquafacility.com;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
