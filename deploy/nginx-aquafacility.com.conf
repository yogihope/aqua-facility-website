# /etc/nginx/sites-available/aquafacility.com
# Main site. certbot --nginx adds the 443 block and the http->https redirect.
# www is listed so the certificate and redirect cover it the moment the www
# DNS record moves to this server.
server {
    server_name aquafacility.com;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aquafacility.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aquafacility.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = www.aquafacility.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aquafacility.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aquafacility.com www.aquafacility.com;
    return 404; # managed by Certbot




}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aquafacility.com;
    ssl_certificate /etc/letsencrypt/live/aquafacility.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aquafacility.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://aquafacility.com$request_uri;
}
